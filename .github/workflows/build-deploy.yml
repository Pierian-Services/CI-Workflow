name: Build & Deploy

# This is a REUSABLE workflow — it does nothing on its own.
# Each app repo calls it from a tiny workflow from app repo added with docker yml.
on:
  workflow_call:
    inputs:
      frontend_dockerfile:
        description: Path to the frontend Dockerfile
        type: string
        default: Dockerfile.frontend
      backend_dockerfile:
        description: Path to the backend Dockerfile
        type: string
        default: Dockerfile.backend

env:
  REGISTRY: ghcr.io

jobs:
  build-deploy:
    name: Build & push images, deploy on VM
    runs-on: [self-hosted, azure-vm]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Frontend
      - name: Extract metadata - frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.frontend_dockerfile }}
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://meridian.pierianservices.com' }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://meridian.pierianservices.com' }}
            VITE_SSO_ENABLED=${{ vars.VITE_SSO_ENABLED || 'true' }}
            VITE_SSO_DOMAINS=${{ vars.VITE_SSO_DOMAINS || 'pierianservices.com,pierianservices.co.in' }}
            VITE_ENV=production
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Backend
      - name: Extract metadata - backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.backend_dockerfile }}
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Deploy
      - name: Deploy containers
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
