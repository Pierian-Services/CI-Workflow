name: Build & Deploy

# This is a REUSABLE workflow — it does nothing on its own.
# Each app repo calls it from a tiny workflow from app repo added with docker yml.
on:
  workflow_call:
    inputs:
      frontend_dockerfile:
        description: Path to the frontend Dockerfile
        type: string
        default: Dockerfile.frontend
      backend_dockerfile:
        description: Path to the backend Dockerfile
        type: string
        default: Dockerfile.backend
      k8s_app:
        description: >-
          k8s deployment prefix for this app in the `pierian` namespace.
          Deployments must be named <k8s_app>-backend and <k8s_app>-frontend
          with containers named `backend` / `frontend`.
          (e.g. any2any, vapt, xl-merger, pdf-splitter, xl-splitter)
        type: string
        required: true
      k8s_namespace:
        description: Kubernetes namespace the app is deployed in
        type: string
        default: pierian

env:
  REGISTRY: ghcr.io

jobs:
  # Secret scan gate — runs before anything is built or deployed.
  # Free substitute for GitHub Advanced Security push protection: uses the
  # gitleaks binary directly (the gitleaks-action requires a paid org license).
  # If a secret is found the job fails and build-deploy never runs.
  # To allowlist a known false positive, add a .gitleaksignore file (list the
  # reported fingerprints) or a .gitleaks.toml config in the app repo.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: [self-hosted, azure-vm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan every commit

      - name: Install & run gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
          # --redact keeps secret values out of the logs; --exit-code 1 fails the job on any finding.
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  build-deploy:
    name: Build & push images, deploy on VM
    needs: secret-scan
    runs-on: [self-hosted, azure-vm]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Frontend
      - name: Extract metadata - frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.frontend_dockerfile }}
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://meridian.pierianservices.com' }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://meridian.pierianservices.com' }}
            VITE_SSO_ENABLED=${{ vars.VITE_SSO_ENABLED || 'true' }}
            VITE_SSO_DOMAINS=${{ vars.VITE_SSO_DOMAINS || 'pierianservices.com,pierianservices.co.in' }}
            VITE_ENV=production
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Backend
      - name: Extract metadata - backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.backend_dockerfile }}
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Deploy — roll the k8s Deployments to the exact images just built.
      # Runs on the self-hosted azure-vm runner (user digital-pro), which has
      # cluster-admin kubectl access to the local node — no kubeconfig secret
      # needed. Images are pinned by DIGEST (immutable, exact); the k8s node
      # pulls them from GHCR using the in-cluster `ghcr-pull` secret.
      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: /home/digital-pro/.kube/config
          NS: ${{ inputs.k8s_namespace }}
          APP: ${{ inputs.k8s_app }}
          FE_DIGEST: ${{ steps.build-frontend.outputs.digest }}
          BE_DIGEST: ${{ steps.build-backend.outputs.digest }}
        run: |
          set -euo pipefail
          # GHCR paths must be lowercase; github.repository can contain capitals.
          IMAGE_BASE=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "Deploying '$APP' in namespace '$NS'"
          echo "  backend  = ${IMAGE_BASE}-backend@${BE_DIGEST}"
          echo "  frontend = ${IMAGE_BASE}-frontend@${FE_DIGEST}"

          kubectl -n "$NS" set image deployment/"${APP}-backend"  backend="${IMAGE_BASE}-backend@${BE_DIGEST}"
          kubectl -n "$NS" set image deployment/"${APP}-frontend" frontend="${IMAGE_BASE}-frontend@${FE_DIGEST}"

          # Wait for both rollouts; fail the job if either stalls.
          kubectl -n "$NS" rollout status deployment/"${APP}-backend"  --timeout=300s
          kubectl -n "$NS" rollout status deployment/"${APP}-frontend" --timeout=300s
